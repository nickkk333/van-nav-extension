<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VanNav</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="popup container">

    <!-- ===== 顶部品牌栏 ===== -->
    <header class="app-header">
      <img class="app-logo" src="images/logo.png" alt="VanNav Logo" />
      <span class="app-name">VanNav</span>
      <div class="app-actions">
        <button id="refreshCatalog" class="icon-btn" type="button" title="刷新分类" aria-label="刷新分类">
          <svg viewBox="0 0 24 24">
            <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== 主页 ===== -->
    <section id="mainPage" class="page active" aria-label="主菜单">
      <div id="currentTabInfo" class="tab-info hidden"></div>

      <button id="addTool" class="menu-btn primary" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
        </svg>
        <span>添加当前页面</span>
      </button>
      <button id="openAdmin" class="menu-btn" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
        </svg>
        <span>后台管理</span>
      </button>
      <button id="openWebsite" class="menu-btn" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z" />
        </svg>
        <span>打开前台页面</span>
      </button>
      <button id="openSetting" class="menu-btn" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
        </svg>
        <span>扩展设置</span>
      </button>
      <button id="openWindow" class="menu-btn small" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7z" />
        </svg>
        <span>在独立窗口打开</span>
      </button>

      <footer class="app-footer">
        <span>VanNav 扩展 v1.1.0</span>
      </footer>
    </section>
    <!-- ===== 添加工具 ===== -->
    <section id="confirmPage" class="page" aria-label="添加工具">
      <h2 class="page-title">添加工具</h2>
      <p class="hint">表单已根据当前页面自动填充，可修改后提交。</p>
      <form id="addForm" novalidate>
        <label for="catelog">分类<span class="required">*</span>
          <select id="catelog" name="catelog" required>
            <option value="">暂无分类，请先获取</option>
          </select>
        </label>
        <label for="name">名称<span class="required">*</span>
          <input id="name" name="name" type="text" placeholder="请输入名称" autocomplete="off" required />
        </label>
        <label for="url">网址<span class="required">*</span>
          <input id="url" name="url" type="text" placeholder="https://example.com" autocomplete="off" inputmode="url" required />
        </label>
        <label for="logo">图标<span class="optional">（可选）</span>
          <input id="logo" name="logo" type="text" placeholder="图标地址" autocomplete="off" />
        </label>
        <label for="desc">描述<span class="required">*</span>
          <input id="desc" name="desc" type="text" placeholder="请输入描述" autocomplete="off" required />
        </label>

        <label class="switch-row" for="hide1">
          <input id="hide1" name="hide" type="checkbox" role="switch" />
          设为隐藏
        </label>

        <label class="switch-row" for="default1">
          <input id="default1" name="default1" type="checkbox" role="switch" checked />
          设为默认展示
        </label>

        <div class="page-actions">
          <button id="confirmAdd" type="submit">确定添加</button>
          <button id="cancelAdd" class="secondary outline" type="button">返回</button>
        </div>
      </form>
    </section>

    <!-- ===== 设置 ===== -->
    <section id="settingPage" class="page" aria-label="扩展设置">
      <h2 class="page-title">扩展设置</h2>
      <form id="settingForm" novalidate>
        <label for="baseUrl">站点地址<span class="required">*</span>
          <input id="baseUrl" name="baseUrl" type="url" placeholder="https://nav.your-site.com" autocomplete="off" required />
        </label>

        <label for="token">API Token<span class="required">*</span>
          <div class="token-input">
            <input id="token" name="token" type="password" placeholder="请输入 Token" autocomplete="off" required />
            <button id="toggleToken" class="icon-btn" type="button" title="显示/隐藏 Token">显示</button>
          </div>
        </label>

        <div class="page-actions">
          <button id="confirmSetting" type="submit">保存设置</button>
          <button id="cancelSetting" class="secondary outline" type="button">返回</button>
        </div>

        <div class="page-actions split">
          <button id="testConn" class="secondary outline" type="button">测试连接</button>
          <button id="fetchCatelog" class="secondary outline" type="button">获取分类</button>
        </div>

        <p class="hint">提示：在 VanNav 后台「设置」页面可获取站点地址与 API Token。站点地址填到域名部分即可，无需包含 /admin。</p>
      </form>
    </section>

    <!-- ===== 加载遮罩 ===== -->
    <div class="page-loader" aria-hidden="true">
      <div class="spinner"></div>
      <p>加载中…</p>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <div id="toastContent" class="toast__content"></div>
    </div>
  </main>

  <script src="action.js"></script>
</body>

</html>
